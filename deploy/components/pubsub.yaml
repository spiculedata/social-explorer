apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis:6379
  # Password comes from the REDIS_PASSWORD environment variable of the sidecar container
  # (docker-compose.yml sets it; the same value is passed to redis-server as --requirepass).
  - name: redisPassword
    secretKeyRef:
      name: REDIS_PASSWORD
      key: REDIS_PASSWORD
  - name: enableTLS
    value: false
scopes:
- ex-accell-ui
