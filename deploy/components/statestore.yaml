apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis:6379
  - name: redisPassword
    secretKeyRef:
      name: localsecret
      key: redisPassword
  - name: enableTLS
    value: false
  - name: actorStateStore
    value: "true"
