# Reads secrets from the sidecar container's environment (Dapr >= 1.11). docker-compose.yml
# passes REDIS_PASSWORD to the ui-dapr container; components reference it by secretKeyRef.
# Scope the store to the app that owns it.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: envstore
spec:
  type: secretstores.local.env
  version: v1
scopes:
- ex-accell-ui
