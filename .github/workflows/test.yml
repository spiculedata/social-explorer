name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: ex-accell-ui/package-lock.json

      - name: Install dependencies
        working-directory: ex-accell-ui
        run: npm ci

      - name: Lint (errors fail, warnings are tracked by the ratchet tests)
        working-directory: ex-accell-ui
        run: npm run lint

      - name: Type check
        working-directory: ex-accell-ui
        run: npm run check || true

      - name: Build
        working-directory: ex-accell-ui
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: |
            ex-accell-ui/build/
            ex-accell-ui/.svelte-kit/
          retention-days: 1

  unit-tests:
    name: Unit Tests (Vitest)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: ex-accell-ui/package-lock.json

      - name: Install dependencies
        working-directory: ex-accell-ui
        run: npm ci

      - name: Run unit tests
        working-directory: ex-accell-ui
        run: npx vitest run --coverage --reporter=default

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: ex-accell-ui/coverage/
          if-no-files-found: ignore

  playwright-e2e:
    name: E2E Tests (Playwright)
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgduckdb/pgduckdb:17-main
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:changeme@localhost:5432/analytics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: ex-accell-ui/package-lock.json

      - name: Install dependencies
        working-directory: ex-accell-ui
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: ex-accell-ui/

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('ex-accell-ui/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: ex-accell-ui
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ex-accell-ui
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ex-accell-ui/playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ex-accell-ui/test-results/
          if-no-files-found: ignore

  # CI tooling tests: the Node scripts under scripts/ (change classifier, issue gate, reports, ...)
  # that the repository's own workflows run. Hermetic: node:test, no dependencies, no install step.
  scripts:
    name: Scripts (node tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Test
        run: node --test "scripts/tests/*.test.mjs"

  # ETL tests (etl/test_safe_http.py, etl/test_image_pipeline_clip.py). test_safe_http.py
  # guards the network boundary in etl/safe_http.py (private addresses, redirects,
  # response limits, DNS); test_image_pipeline_clip.py pins the CLIP model config that
  # reproduces the old embeddings (its fixture stubs the heavy deps, so pytest and
  # requests are all it needs). Both were previously run only nightly or as an advisory
  # check, so the required `ci` job could pass while they failed. Part of the `ci`
  # rollup: a failure or skip here fails the gate.
  etl-tests:
    name: ETL tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ETL test dependencies
        run: python3 -m venv .venv && .venv/bin/pip install --quiet pytest requests

      - name: Run ETL tests
        working-directory: etl
        run: ../.venv/bin/python -m pytest -q test_safe_http.py test_image_pipeline_clip.py

  # Single stable check name for the merge convention, the review rubric and the hive's auto-red
  # watcher. The `protect main` ruleset is meant to require this check by name. It rolls up the jobs
  # of THIS workflow only; Jupyter, Docs, Demo script, Secret scan and Dependency audit are separate,
  # path-filtered workflows and are not part of it. Add a job to `needs` when it joins the gate.
  #
  # `if: always()` so the rollup still reports when a needed job fails or is cancelled, and every
  # needed job must have succeeded: a skipped needed job (for example `unit-tests` when `build`
  # failed) is a failure, not a pass.
  ci:
    name: ci
    needs: [build, unit-tests, playwright-e2e, scripts, etl-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # test.yml sets no workflow-level permissions, so the repository default (read-write) would apply.
    permissions:
      contents: read
    steps:
      - name: All required jobs passed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          E2E_RESULT: ${{ needs.playwright-e2e.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
          ETL_RESULT: ${{ needs.etl-tests.result }}
        run: |
          fail=0
          for entry in "build=$BUILD_RESULT" "unit-tests=$UNIT_TESTS_RESULT" "playwright-e2e=$E2E_RESULT" "scripts=$SCRIPTS_RESULT" "etl-tests=$ETL_RESULT"; do
            if [ "${entry#*=}" = "success" ]; then
              echo "ok: $entry"
            else
              echo "::error::${entry%%=*} finished as ${entry#*=}"
              fail=1
            fi
          done
          exit "$fail"
