name: labeler

# Path-based PR labels from .github/labeler.yml. Security notes, because this
# workflow holds a write scope:
#
#   - it only runs on pull_request (never pull_request_target), so it never
#     evaluates fork code in a privileged context;
#   - the action is pinned to a commit SHA, not a mutable tag;
#   - the token gets contents:read and pull-requests:write and nothing else.
#
# Fork pull requests are skipped entirely (the head repository must be this one):
# the fork token is read-only, so labels it writes would fail anyway and the job
# previously showed as a red check on every fork PR. Same-repository PRs still
# get labelled; a missing label still never turns a good PR red.
# Nothing requires this check.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    # Skip fork PRs: their GITHUB_TOKEN is read-only, so labelling would fail
    # and the check shows red even with continue-on-error.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          # Keep the author's own labels when the config changes: removing one
          # should be a human decision, not a side effect of a push.
          sync-labels: false
