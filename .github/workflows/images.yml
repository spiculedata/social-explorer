name: Images

# Builds (never pushes) the ETL, WavePulse and UI images so a base-image or dependency bump is
# exercised before it merges. The Jupyter image has its own job in jupyter.yml.
on:
  push:
    branches: [main]
    paths:
      - 'etl/**'
      - 'wavepulse/**'
      - 'ex-accell-ui/**'
      - '.github/workflows/images.yml'
  pull_request:
    branches: [main]
    paths:
      - 'etl/**'
      - 'wavepulse/**'
      - 'ex-accell-ui/**'
      - '.github/workflows/images.yml'

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per image: the ETL image (paddle + torch, ~1 GiB of wheels) can exceed a
  # 45-minute job on a cold cache, and a shared job meant one slow image sank the other
  # two and re-built everything on every retry. Separate jobs build in parallel, isolate
  # each cache scope and give the big images their own time budget.
  etl:
    name: Docker image (build only · etl)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ETL image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./etl
          file: ./etl/Dockerfile
          push: false
          cache-from: type=gha,scope=etl
          cache-to: type=gha,scope=etl,mode=max

  wavepulse:
    name: Docker image (build only · wavepulse)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build WavePulse image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./wavepulse
          file: ./wavepulse/Dockerfile
          push: false
          cache-from: type=gha,scope=wavepulse
          cache-to: type=gha,scope=wavepulse,mode=max

  ui:
    name: Docker image (build only · ui)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build UI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ex-accell-ui
          file: ./ex-accell-ui/Dockerfile
          push: false
          load: true
          tags: ex-accell-ui-ci:${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

      # The runtime stage of ex-accell-ui/Dockerfile must never fall back to root (issue #326): the
      # app serves user data, and a root runtime sidesteps the volume permissions ui-init sets up.
      - name: UI image must not run as root
        run: |
          uid="$(docker run --rm ex-accell-ui-ci:${{ github.sha }} id -u)"
          echo "UI image runtime uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::The ex-accell-ui image runs as root (uid 0); its runtime stage must set USER to a non-root user"
            exit 1
          fi
