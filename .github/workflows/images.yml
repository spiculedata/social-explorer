name: Images

# Builds (never pushes) the ETL, WavePulse and UI images so a base-image or dependency bump is
# exercised before it merges. The Jupyter image has its own job in jupyter.yml.
on:
  push:
    branches: [main]
    paths:
      - 'etl/**'
      - 'wavepulse/**'
      - 'ex-accell-ui/**'
      - '.github/workflows/images.yml'
  pull_request:
    branches: [main]
    paths:
      - 'etl/**'
      - 'wavepulse/**'
      - 'ex-accell-ui/**'
      - '.github/workflows/images.yml'

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker images (build only)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ETL image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./etl
          file: ./etl/Dockerfile
          push: false
          cache-from: type=gha,scope=etl
          cache-to: type=gha,scope=etl,mode=max

      - name: Build WavePulse image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./wavepulse
          file: ./wavepulse/Dockerfile
          push: false
          cache-from: type=gha,scope=wavepulse
          cache-to: type=gha,scope=wavepulse,mode=max

      - name: Build UI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ex-accell-ui
          file: ./ex-accell-ui/Dockerfile
          push: false
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max
