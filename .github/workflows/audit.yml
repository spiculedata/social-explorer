name: Dependency audit

# Separate from the test workflow so a new upstream advisory reads as "dependency advisory",
# not as broken tests. Also runs weekly, so advisories are noticed without an unrelated PR.
on:
  pull_request:
    paths:
      - 'ex-accell-ui/package.json'
      - 'ex-accell-ui/package-lock.json'
      - 'etl/requirements-etl.txt'
      - 'etl/requirements.lock'
      - 'wavepulse/requirements.txt'
      - 'wavepulse/requirements.lock'
  push:
    branches: [main]
    paths:
      - 'ex-accell-ui/package.json'
      - 'ex-accell-ui/package-lock.json'
      - 'etl/requirements-etl.txt'
      - 'etl/requirements.lock'
      - 'wavepulse/requirements.txt'
      - 'wavepulse/requirements.lock'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (production)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Fails on high or critical advisories in shipped (production) dependencies
      - name: Audit production dependencies
        working-directory: ex-accell-ui
        run: npm audit --omit=dev --audit-level=high

  pip-audit:
    name: pip audit (etl, wavepulse)
    # The Python images have no lock audit today; pip-audit checks the exact installed set (the
    # requirements.lock files) against the PyPI vulnerability database. Only the two shipped
    # images are audited; the jupyter image has its own workflow (jupyter.yml).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # The lock files are fully pinned, so --no-deps skips pointless resolution
      - name: Audit the ETL image dependency set
        run: pip-audit --no-deps -r etl/requirements.lock

      # The WavePulse lock cannot reach fixed versions of torch or transformers: whisperx —
      # the package that needs them — pins torch~=2.8.0 / torchaudio~=2.8.0 (its latest
      # release, 3.8.6; every 3.x pins the same series) and huggingface-hub<1.0.0, which
      # blocks transformers 5.x. Every finding ignored below is fixed only in torch >= 2.9
      # (one needs >= 2.13) and transformers >= 5.x, none reachable from this pin set. They
      # are accepted here, watched, and the matching --ignore-vuln is dropped as soon as a
      # whisperx release lifts the caps so the lock can take the fixed versions.
      - name: Audit the WavePulse image dependency set
        run: >-
          pip-audit --no-deps -r wavepulse/requirements.lock
          --ignore-vuln PYSEC-2025-206 --ignore-vuln PYSEC-2025-204 --ignore-vuln PYSEC-2026-139
          --ignore-vuln PYSEC-2025-203 --ignore-vuln PYSEC-2025-193 --ignore-vuln PYSEC-2025-194
          --ignore-vuln PYSEC-2025-195 --ignore-vuln PYSEC-2026-2286 --ignore-vuln PYSEC-2026-1856
          --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2026-2288 --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290 --ignore-vuln PYSEC-2026-3929 --ignore-vuln PYSEC-2026-4174
