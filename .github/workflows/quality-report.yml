name: quality-report

# Quality dashboard: lint, tests, audit and coverage on one page for the parts of the repo that
# can be measured on a plain Linux runner (the web app and the Python tests that need no
# database). Runs the real tools, saves their output, and renders it with
# scripts/quality-report.mjs. Reporting only: it publishes the page as a job summary and a
# workflow artifact, never commits, and nothing gates on it (test.yml does not depend on it). A
# pull request that changes the report itself runs it too, so a broken report shows up in review.
# No secrets are used and the token is read-only.

on:
  schedule:
    # Mondays 07:11 UTC, off the hour.
    - cron: "11 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/quality-report.mjs"
      - "scripts/tests/quality-report.test.mjs"
      - ".github/workflows/quality-report.yml"
      - "docs/quality.md"

permissions:
  contents: read

concurrency:
  group: quality-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Quality report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ex-accell-ui/package-lock.json

      - name: Install web dependencies
        working-directory: ex-accell-ui
        run: npm ci

      # Every command is `|| true`: this page reports what the tools say, it does not gate. A tool
      # that produced no output shows as "not available" rather than as zero.
      - name: Run the tools
        run: |
          mkdir -p quality
          (cd ex-accell-ui && npx eslint . -f json -o ../quality/web-lint.json) || true
          (cd ex-accell-ui && npx vitest run --reporter=json --outputFile=../quality/web-vitest.json --coverage --coverage.reporter=json-summary --coverage.reportsDirectory=../quality/coverage) || true
          cp quality/coverage/coverage-summary.json quality/web-coverage-summary.json || true
          (cd ex-accell-ui && npm audit --omit=dev --json > ../quality/web-audit-prod.json) || true
          (cd ex-accell-ui && npm audit --json > ../quality/web-audit-all.json) || true
          python3 -m venv .venv
          .venv/bin/pip install --quiet pytest requests
          PYTHONPATH=jupyter:etl .venv/bin/python -m pytest -q --junitxml=quality/python-junit.xml jupyter/tests etl/test_safe_http.py || true

      - name: Render the report
        run: |
          node scripts/quality-report.mjs --in quality --out quality/quality-report.md
          cat quality/quality-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: quality/quality-report.md
          retention-days: 90
