version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /ex-accell-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
  - package-ecosystem: docker
    directory: /ex-accell-ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  # VitePress docs site
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      docs-minor-and-patch:
        update-types: [minor, patch]

  # Python: ETL pipelines, Jupyter image, WavePulse service, the UI's notebook
  # environment (pyproject.toml/poetry.lock) and the root requirements-local.txt.
  # One grouped PR per directory for minor and patch bumps; majors stay separate.
  - package-ecosystem: pip
    directories:
      - /
      - /etl
      - /jupyter
      - /wavepulse
      - /ex-accell-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Base images of the other Dockerfiles. The Python version is held per image to the newest one
  # whose dependencies all install: ETL stays on 3.12 (paddlepaddle<3 has no wheels above it),
  # WavePulse is on 3.13 (whisperx and ctranslate2 have no 3.14 wheels), Jupyter is on 3.14 (3.15
  # has no wheels for most dependencies yet). images.yml and jupyter.yml build these images, so
  # lift an ignore only once that build passes on the newer Python.
  - package-ecosystem: docker
    directory: /etl
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /wavepulse
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]
  - package-ecosystem: docker
    directory: /jupyter
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "python"
        versions: [">=3.15"]

  # docker-compose.yml's third-party images (postgres, redis, the Dapr sidecars, ollama) are
  # pinned by digest, so a bump reads as a digest change and is reviewed deliberately.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
