name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`, or the release you are running
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, and whether you use Docker Compose
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove any secrets, tokens, collected posts or other personal data first.
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: |
        How we will know this is done, as a checklist (`- [ ] ...`). Optional for reporters. A maintainer
        needs it before they can label the issue `issue-approved` for an agent to work on.
      placeholder: |
        - [ ] The behaviour above no longer happens
        - [ ] A test covers it (synthetic data only)
