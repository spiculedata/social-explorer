name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: |
        How we will know this is done, as a checklist (`- [ ] ...`). Optional for reporters. A maintainer
        needs it before they can label the issue `issue-approved` for an agent to work on.
      placeholder: |
        - [ ] The behaviour above no longer happens
        - [ ] A test covers it (synthetic data only)
