apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: telegram-scraper-app
spec:
  type: bindings.http
  version: v1
  metadata:
  - name: url
    value: "http://localhost:3001"
  - name: method
    value: "POST"
# scopes must sit at the top level of the component: indented under spec.metadata it is
# ignored and the binding is unscoped (readable by any app the sidecar hosts).
scopes:
- ex-accell-ui
