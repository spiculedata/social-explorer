apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: localhost:6379
  # Password comes from the local-file secret store (./secrets.json, key redisPassword).
  # scripts/setup-deployment.sh starts the dev Redis with that password and writes it into
  # secrets.json; keep the value out of git.
  - name: redisPassword
    secretKeyRef:
      name: redisPassword
      key: redisPassword
  - name: enableTLS
    value: false
  - name: actorStateStore
    value: "true"
scopes:
- ex-accell-ui
